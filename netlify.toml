# The website is a static export of the Next.js app in site/.
[build]
  base = "site"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# /health answers with the same JSON as /health.json: which commit is live.
[[redirects]]
  from = "/health"
  to = "/health.json"
  status = 200

[[headers]]
  for = "/health.json"
  [headers.values]
    Cache-Control = "no-store"
