# The website is a static export of the Next.js app in site/.
[build]
  base = "site"
  command = "npm run build"
  publish = "out"
  # With a base directory, Netlify skips a build when nothing under it changed. The site also reads
  # skills/ and domains.json, so build when any of them changed. Exit 1 means "build".
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../skills ../domains.json ../netlify.toml"

[build.environment]
  NODE_VERSION = "22"

# /health answers with the same JSON as /health.json: which commit is live.
[[redirects]]
  from = "/health"
  to = "/health.json"
  status = 200

[[headers]]
  for = "/health.json"
  [headers.values]
    Cache-Control = "no-store"
